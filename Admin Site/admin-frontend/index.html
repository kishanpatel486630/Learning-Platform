<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — LearnPath</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--bg);
      }
      .login-box {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: var(--shadow);
      }
      .logo-icon {
        font-size: 3rem;
        margin-bottom: 16px;
      }
      .login-title {
        font-family: "Syne", sans-serif;
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }
      .login-sub {
        font-size: 0.9rem;
        color: var(--text3);
        margin-bottom: 32px;
      }
      .btn-block {
        width: 100%;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="logo-icon">🛡️</div>
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-sub">Secure access for platform administrators.</p>
      
      <div class="lp-input-group" style="text-align: left;">
        <label>Admin Email</label>
        <input type="email" class="lp-input" placeholder="admin@learnpath.com" id="email" />
      </div>
      <div class="lp-input-group" style="text-align: left;">
        <label>Secure Password</label>
        <input type="password" class="lp-input" placeholder="••••••••" id="password" />
      </div>
      
      <button class="lp-btn lp-btn-primary btn-block" style="margin-top: 16px;" onclick="window.location.href='dashboard.html'">
        Login to Dashboard
      </button>
    </div>
  </body>
</html>
