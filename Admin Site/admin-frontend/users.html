<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users — AdminPanel</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <style>
      .search-bar {
        display: flex; gap: 12px; margin-bottom: 24px; align-items: center;
      }
      .search-bar .lp-input { max-width: 360px; }
      .user-table { width: 100%; border-collapse: collapse; }
      .user-table th {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 2px solid var(--border);
        font-family: "Syne", sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .user-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 0.92rem;
        vertical-align: middle;
      }
      .user-table tbody tr:hover { background: var(--surface); }
      .user-avatar {
        width: 36px; height: 36px; border-radius: 50%;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
        font-family: "Syne", sans-serif;
        font-weight: 700; font-size: 0.88rem;
        color: #fff; flex-shrink: 0;
      }
      .user-name-cell { display: flex; align-items: center; gap: 12px; }
      .xp-badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--accent);
      }
      .unban-btn {
        background: rgba(16,185,129,0.1);
        border: 1px solid rgba(16,185,129,0.3);
        color: var(--success);
        padding: 5px 12px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: all 0.2s;
      }
      .unban-btn:hover { background: rgba(16,185,129,0.2); }
      .ban-btn {
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.25);
        color: var(--danger);
        padding: 5px 12px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: all 0.2s;
      }
      .ban-btn:hover { background: rgba(239,68,68,0.18); }
      .empty-table { text-align: center; padding: 48px; color: var(--text3); }
      .logout-btn {
        background: none; border: 1px solid var(--border);
        color: var(--text2); padding: 6px 14px; border-radius: 8px;
        cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
      }
      .logout-btn:hover { border-color: var(--danger); color: var(--danger); }
    </style>
  </head>
  <body>
    <!-- Sidebar (correct class names) -->
    <div class="sidebar" id="sidebar">
      <div class="sb-logo">
        <div class="sb-logo-icon">🛡️</div>
        <div class="sb-logo-text">AdminPanel</div>
        <button class="sb-collapse-btn" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">◀</button>
      </div>
      <div class="sb-nav">
        <a href="dashboard.html" class="sb-link">
          <span class="sb-link-icon">📊</span>
          <span class="sb-link-text">Overview</span>
        </a>
        <a href="users.html" class="sb-link active">
          <span class="sb-link-icon">👥</span>
          <span class="sb-link-text">Manage Users</span>
        </a>
        <a href="roadmaps.html" class="sb-link">
          <span class="sb-link-icon">🗺️</span>
          <span class="sb-link-text">Study Plans</span>
        </a>
      </div>
      <div class="sb-user">
        <div class="sb-user-avatar" style="background: var(--accent);">A</div>
        <div class="sb-user-info">
          <div class="sb-user-name">Admin</div>
          <div class="sb-user-email">admin@learnpath.com</div>
        </div>
      </div>
    </div>

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="topbar-btn" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">☰</button>
        <h2 class="topbar-title">Manage Users</h2>
      </div>
      <div class="topbar-right">
        <div class="topbar-stat" id="userCount">– Users</div>
        <button class="logout-btn" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="page-content">
        <div class="lp-card-flat">
          <!-- Search Bar -->
          <div class="search-bar">
            <input type="text" class="lp-input" id="searchInput" placeholder="🔍  Search by name or email..." oninput="filterUsers()" />
            <select class="lp-select" id="filterStatus" onchange="filterUsers()" style="max-width: 160px;">
              <option value="all">All Users</option>
              <option value="active">Active Only</option>
              <option value="banned">Banned Only</option>
            </select>
          </div>

          <table class="user-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>XP</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="5" class="empty-table">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="js/admin-api.js"></script>
    <script>
      if (!localStorage.getItem("adminToken")) window.location.href = "index.html";

      const savedTheme = localStorage.getItem("adminTheme");
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;

      function doLogout() {
        localStorage.removeItem("adminToken");
        localStorage.removeItem("adminEmail");
        window.location.href = "index.html";
      }

      let allUsers = [];

      function getInitials(name) {
        if (!name) return "?";
        return name.split(" ").map(w => w[0]).join("").substring(0, 2).toUpperCase();
      }

      function renderUsers(users) {
        const tbody = document.getElementById("usersTableBody");
        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-table">No users found.</td></tr>`;
          return;
        }

        tbody.innerHTML = users.map(u => {
          const isBanned = !!u.banned;
          return `
            <tr>
              <td>
                <div class="user-name-cell">
                  <div class="user-avatar">${getInitials(u.name)}</div>
                  <strong>${u.name || "Anonymous"}</strong>
                </div>
              </td>
              <td style="color:var(--text2);">${u.email || "–"}</td>
              <td><span class="xp-badge">${u.xp || 0} XP</span></td>
              <td>
                <span class="lp-tag ${isBanned ? 'lp-tag-danger' : 'lp-tag-success'}">
                  ${isBanned ? "🚫 Banned" : "✅ Active"}
                </span>
              </td>
              <td>
                ${isBanned
                  ? `<button class="unban-btn" onclick="unbanUser('${u._id}')">Unban</button>`
                  : `<button class="ban-btn" onclick="banUser('${u._id}', '${u.name || u.email}')">Ban</button>`
                }
              </td>
            </tr>
          `;
        }).join("");
      }

      function filterUsers() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        const status = document.getElementById("filterStatus").value;

        let filtered = allUsers.filter(u => {
          const matchSearch = (u.name || "").toLowerCase().includes(query) ||
                              (u.email || "").toLowerCase().includes(query);
          const matchStatus = status === "all" ||
                              (status === "banned" && u.banned) ||
                              (status === "active" && !u.banned);
          return matchSearch && matchStatus;
        });

        renderUsers(filtered);
      }

      async function loadUsers() {
        try {
          const res = await AdminAPI.getUsers();
          allUsers = res.users;
          document.getElementById("userCount").textContent = `${allUsers.length} Users`;
          renderUsers(allUsers);
        } catch (e) {
          document.getElementById("usersTableBody").innerHTML =
            `<tr><td colspan="5" class="empty-table" style="color:var(--danger);">Failed to load users: ${e.message}</td></tr>`;
        }
      }

      async function banUser(id, name) {
        if (!confirm(`Ban user "${name}"? They will lose access to the platform.`)) return;
        try {
          await AdminAPI.banUser(id);
          await loadUsers();
        } catch (e) {
          alert("Error: " + e.message);
        }
      }

      async function unbanUser(id) {
        try {
          await AdminAPI.unbanUser(id);
          await loadUsers();
        } catch (e) {
          alert("Error: " + e.message);
        }
      }

      loadUsers();
    </script>
  </body>
</html>
