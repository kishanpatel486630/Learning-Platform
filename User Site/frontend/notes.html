<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnPath — Notes</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <style>
      .notes-top {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .notes-search {
        flex: 1;
        min-width: 200px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.88rem;
        outline: none;
      }
      .notes-search:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--input-focus);
      }

      .notes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
      }
      .note-card {
        padding: 20px;
        border-radius: 16px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
      }
      .note-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .note-card-color {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        border-radius: 16px 16px 0 0;
      }
      .nc-title {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1rem;
        margin-bottom: 6px;
        padding-right: 30px;
      }
      .nc-preview {
        font-size: 0.82rem;
        color: var(--text2);
        line-height: 1.6;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 10px;
      }
      .nc-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .nc-tags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .nc-tag {
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 0.68rem;
        background: var(--surface);
        color: var(--text3);
      }
      .nc-date {
        font-size: 0.72rem;
        color: var(--text3);
      }
      .nc-del {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: none;
        color: var(--text3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        cursor: pointer;
        opacity: 0;
        transition: all 0.15s;
      }
      .note-card:hover .nc-del {
        opacity: 1;
      }
      .nc-del:hover {
        background: var(--danger);
        color: #fff;
      }

      .add-note-card {
        padding: 30px;
        border-radius: 16px;
        background: var(--surface);
        border: 2px dashed var(--border);
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 160px;
      }
      .add-note-card:hover {
        border-color: var(--accent);
        background: var(--surface2);
      }
      .add-note-icon {
        font-size: 2rem;
        margin-bottom: 6px;
      }
      .add-note-label {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text2);
      }

      /* Editor overlay */
      .editor-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .editor-overlay.active {
        display: flex;
      }
      .editor-modal {
        width: 100%;
        max-width: 720px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        overflow: hidden;
      }
      .editor-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .editor-header h3 {
        font-family: "Syne", sans-serif;
        font-weight: 700;
      }
      .editor-close {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--surface2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.9rem;
        color: var(--text);
      }
      .editor-close:hover {
        background: var(--danger);
        color: #fff;
      }
      .editor-body {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }
      .editor-body .fg {
        margin-bottom: 16px;
      }
      .editor-body .fg label {
        display: block;
        font-weight: 600;
        font-size: 0.82rem;
        color: var(--text2);
        margin-bottom: 5px;
      }
      .editor-body .fi {
        width: 100%;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.9rem;
        outline: none;
      }
      .editor-body .fi:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--input-focus);
      }
      .editor-body textarea.fi {
        min-height: 200px;
        resize: vertical;
        font-family: "DM Sans", sans-serif;
        line-height: 1.7;
      }
      .editor-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-shrink: 0;
      }

      .note-colors {
        display: flex;
        gap: 6px;
      }
      .note-color-dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.15s;
      }
      .note-color-dot.selected {
        border-color: #fff;
        transform: scale(1.15);
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text3);
      }
      .empty-state div {
        font-size: 3rem;
        margin-bottom: 10px;
      }
      .empty-state p {
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-left"><h2 class="topbar-title">Notes</h2></div>
      <div class="topbar-right">
        <div class="topbar-stat">⚡ <span id="topXp">0</span> XP</div>
        <button
          class="topbar-btn"
          id="themeToggleBtn"
          onclick="lpToggleTheme()"
        >
          ☀️
        </button>
      </div>
    </div>

    <div class="main-content">
      <div class="page-content">
        <div class="notes-top">
          <input
            type="text"
            class="notes-search"
            id="notesSearch"
            placeholder="🔍 Search notes…"
            oninput="renderNotes()"
          />
          <button
            class="lp-btn lp-btn-primary lp-btn-sm"
            onclick="openEditor()"
          >
            + New Note
          </button>
        </div>
        <div class="notes-grid" id="notesGrid"></div>
        <div class="empty-state" id="emptyState" style="display: none">
          <div>📝</div>
          <p>
            No notes yet. Create your first note to start organizing your study
            material!
          </p>
        </div>
      </div>
    </div>

    <!-- Editor Modal -->
    <div class="editor-overlay" id="editorOverlay">
      <div class="editor-modal">
        <div class="editor-header">
          <h3 id="editorTitle">New Note</h3>
          <button class="editor-close" onclick="closeEditor()">✕</button>
        </div>
        <div class="editor-body">
          <div class="fg">
            <label>Title</label>
            <input
              type="text"
              class="fi"
              id="noteTitle"
              placeholder="Note title…"
              maxlength="100"
            />
          </div>
          <div class="fg">
            <label>Content</label>
            <textarea
              class="fi"
              id="noteContent"
              placeholder="Write your notes here… (supports plain text)"
            ></textarea>
          </div>
          <div class="fg">
            <label
              >Tags
              <span
                style="
                  font-weight: 400;
                  color: var(--text3);
                  font-size: 0.72rem;
                "
                >(comma separated)</span
              ></label
            >
            <input
              type="text"
              class="fi"
              id="noteTags"
              placeholder="e.g. DBMS, TCS, Arrays"
            />
          </div>
          <div class="fg">
            <label>Color</label>
            <div class="note-colors" id="noteColors"></div>
          </div>
        </div>
        <div class="editor-footer">
          <button class="lp-btn lp-btn-secondary" onclick="closeEditor()">
            Cancel
          </button>
          <button class="lp-btn lp-btn-primary" onclick="saveNote()">
            Save Note
          </button>
        </div>
      </div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
      lpAuthGuard();
      lpInitPage("notes");
      document.getElementById("topXp").textContent = state.xp || 0;

      const NOTE_COLORS = [
        "#7c3aed",
        "#ef4444",
        "#f59e0b",
        "#10b981",
        "#0ea5e9",
        "#ec4899",
        "#8b5cf6",
        "#f97316",
      ];
      let editingNoteId = null;
      let selectedNoteColor = NOTE_COLORS[0];

      // Color picker
      (function () {
        const container = document.getElementById("noteColors");
        NOTE_COLORS.forEach((c) => {
          const dot = document.createElement("div");
          dot.className =
            "note-color-dot" + (c === selectedNoteColor ? " selected" : "");
          dot.style.background = c;
          dot.onclick = () => {
            container
              .querySelectorAll(".note-color-dot")
              .forEach((d) => d.classList.remove("selected"));
            dot.classList.add("selected");
            selectedNoteColor = c;
          };
          container.appendChild(dot);
        });
      })();

      function renderNotes() {
        const search = document
          .getElementById("notesSearch")
          .value.toLowerCase();
        const notes = (state.notes || [])
          .filter((n) => {
            if (!search) return true;
            return (
              n.title.toLowerCase().includes(search) ||
              n.content.toLowerCase().includes(search) ||
              (n.tags || []).some((t) => t.toLowerCase().includes(search))
            );
          })
          .sort(
            (a, b) =>
              new Date(b.updatedAt || b.createdAt) -
              new Date(a.updatedAt || a.createdAt),
          );

        const grid = document.getElementById("notesGrid");
        grid.innerHTML = "";

        // Add new note card
        const addCard = document.createElement("div");
        addCard.className = "add-note-card";
        addCard.onclick = () => openEditor();
        addCard.innerHTML =
          '<div class="add-note-icon">+</div><div class="add-note-label">New Note</div>';
        grid.appendChild(addCard);

        if (notes.length === 0 && !search) {
          document.getElementById("emptyState").style.display = "";
        } else {
          document.getElementById("emptyState").style.display = "none";
        }

        notes.forEach((note) => {
          const card = document.createElement("div");
          card.className = "note-card";
          card.onclick = (e) => {
            if (!e.target.closest(".nc-del")) openEditor(note.id);
          };
          card.innerHTML = `
          <div class="note-card-color" style="background:${note.color || "#7c3aed"}"></div>
          <button class="nc-del" onclick="deleteNote('${note.id}')">✕</button>
          <div class="nc-title">${escHtml(note.title || "Untitled")}</div>
          <div class="nc-preview">${escHtml(note.content || "")}</div>
          <div class="nc-footer">
            <div class="nc-tags">${(note.tags || []).map((t) => `<span class="nc-tag">${escHtml(t)}</span>`).join("")}</div>
            <div class="nc-date">${formatDate(note.updatedAt || note.createdAt)}</div>
          </div>
        `;
          grid.appendChild(card);
        });
      }

      function openEditor(noteId) {
        editingNoteId = noteId || null;
        document.getElementById("editorTitle").textContent = noteId
          ? "Edit Note"
          : "New Note";

        if (noteId) {
          const note = (state.notes || []).find((n) => n.id === noteId);
          if (note) {
            document.getElementById("noteTitle").value = note.title || "";
            document.getElementById("noteContent").value = note.content || "";
            document.getElementById("noteTags").value = (note.tags || []).join(
              ", ",
            );
            selectedNoteColor = note.color || NOTE_COLORS[0];
          }
        } else {
          document.getElementById("noteTitle").value = "";
          document.getElementById("noteContent").value = "";
          document.getElementById("noteTags").value = "";
          selectedNoteColor = NOTE_COLORS[0];
        }

        // Update color selection
        document
          .getElementById("noteColors")
          .querySelectorAll(".note-color-dot")
          .forEach((d) => {
            d.classList.toggle(
              "selected",
              d.style.background === selectedNoteColor ||
                rgbToHex(d.style.background) === selectedNoteColor,
            );
          });

        document.getElementById("editorOverlay").classList.add("active");
        document.getElementById("noteTitle").focus();
      }

      function closeEditor() {
        document.getElementById("editorOverlay").classList.remove("active");
        editingNoteId = null;
      }

      function saveNote() {
        const title = document.getElementById("noteTitle").value.trim();
        const content = document.getElementById("noteContent").value.trim();
        if (!title && !content) {
          lpToast("Please add a title or content!");
          return;
        }

        const tags = document
          .getElementById("noteTags")
          .value.split(",")
          .map((t) => t.trim())
          .filter(Boolean);
        const now = new Date().toISOString();

        if (!state.notes) state.notes = [];

        if (editingNoteId) {
          const note = state.notes.find((n) => n.id === editingNoteId);
          if (note) {
            note.title = title || "Untitled";
            note.content = content;
            note.tags = tags;
            note.color = selectedNoteColor;
            note.updatedAt = now;
          }
        } else {
          state.notes.push({
            id: "note_" + Date.now(),
            title: title || "Untitled",
            content,
            tags,
            color: selectedNoteColor,
            createdAt: now,
            updatedAt: now,
          });
          addXP(5, "note-create");
        }

        saveState();
        closeEditor();
        renderNotes();
        document.getElementById("topXp").textContent = state.xp || 0;
      }

      function deleteNote(id) {
        if (!confirm("Delete this note?")) return;
        state.notes = (state.notes || []).filter((n) => n.id !== id);
        saveState();
        renderNotes();
      }

      function escHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      function formatDate(iso) {
        if (!iso) return "";
        return new Date(iso).toLocaleDateString("en-IN", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function rgbToHex(rgb) {
        if (!rgb || rgb.startsWith("#")) return rgb;
        const m = rgb.match(/\d+/g);
        if (!m) return rgb;
        return (
          "#" +
          m
            .slice(0, 3)
            .map((n) => parseInt(n).toString(16).padStart(2, "0"))
            .join("")
        );
      }

      renderNotes();
    </script>
  </body>
</html>
