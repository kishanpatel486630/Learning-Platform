<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a14;
        --bg2: #101423;
        --card-bg: rgba(16, 20, 35, 0.85);
        --border: rgba(59, 130, 246, 0.18);
        --text: #e2e8f0;
        --text2: #94a3b8;
        --accent: #3b82f6;
        --gradient: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
      }
      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      /* Sidebar */
      .sidebar {
        width: 260px;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 20px 0;
      }
      .sidebar-brand {
        padding: 0 24px 20px;
        font-family: 'Syne', sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        background: var(--gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
      }
      .nav-link {
        padding: 12px 24px;
        color: var(--text2);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav-link:hover, .nav-link.active {
        background: rgba(59, 130, 246, 0.1);
        color: var(--accent);
        border-right: 3px solid var(--accent);
      }
      .logout-btn {
        margin-top: auto;
        padding: 12px 24px;
        color: #ef4444;
        cursor: pointer;
        font-weight: 600;
      }
      /* Main Content */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 70px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 32px;
        background: var(--bg2);
      }
      .topbar h2 {
        font-family: 'Syne', sans-serif;
        margin: 0;
      }
      .content {
        padding: 32px;
        overflow-y: auto;
        flex: 1;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 24px;
        margin-bottom: 32px;
      }
      .stat-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      }
      .stat-title {
        color: var(--text2);
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      .stat-value {
        font-family: 'Syne', sans-serif;
        font-size: 2.5rem;
        font-weight: 800;
        margin-top: 8px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-brand">Admin Panel</div>
      <a href="dashboard.html" class="nav-link active">📊 Dashboard</a>
      <a href="#" class="nav-link">👥 Manage Users</a>
      <a href="#" class="nav-link">🗺️ Study Plans</a>
      <a href="#" class="nav-link">📝 Question Bank</a>
      
      <div class="logout-btn" onclick="logout()">🚪 Logout</div>
    </div>
    
    <div class="main">
      <div class="topbar">
        <h2>Platform Overview</h2>
      </div>
      <div class="content">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Total Users</div>
            <div class="stat-value" id="totalUsers">--</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Active Courses</div>
            <div class="stat-value" id="activeRoadmaps">--</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Questions</div>
            <div class="stat-value" id="totalQuestions">--</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Server Status</div>
            <div class="stat-value" id="serverStatus" style="color: #10b981;">--</div>
          </div>
        </div>
        
        <!-- Add more tables or lists here -->
      </div>
    </div>

    <script>
      // Auth Guard
      const token = localStorage.getItem('adminToken');
      if (!token) {
        window.location.href = 'index.html';
      }

      async function fetchStats() {
        try {
          const res = await fetch('http://localhost:5000/api/admin/dashboard-stats', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          
          if (res.status === 401 || res.status === 403) {
            logout();
          }

          const data = await res.json();
          document.getElementById('totalUsers').textContent = data.totalUsers;
          document.getElementById('activeRoadmaps').textContent = data.activeRoadmaps;
          document.getElementById('totalQuestions').textContent = data.totalQuestions;
          document.getElementById('serverStatus').textContent = data.serverStatus;
        } catch (e) {
          console.error('Failed to fetch stats', e);
        }
      }

      function logout() {
        localStorage.removeItem('adminToken');
        window.location.href = 'index.html';
      }

      fetchStats();
    </script>
  </body>
</html>
