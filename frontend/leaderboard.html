<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnPath — Leaderboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <style>
      .lb-hero {
        text-align: center;
        padding: 30px;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--accent), #a855f7);
        color: #fff;
        margin-bottom: 24px;
      }
      .lb-hero h2 {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .lb-hero p {
        opacity: 0.85;
        font-size: 0.88rem;
      }
      .lb-invite-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .lb-invite-input {
        padding: 9px 14px;
        border-radius: 10px;
        border: none;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 0.85rem;
        min-width: 200px;
        outline: none;
      }
      .lb-invite-input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      .lb-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .lb-tab {
        padding: 8px 18px;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        background: var(--surface);
        color: var(--text2);
        border: 1px solid var(--border);
        transition: all 0.2s;
      }
      .lb-tab.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .lb-tab:hover:not(.active) {
        background: var(--surface2);
      }

      .lb-table {
        width: 100%;
        border-collapse: collapse;
      }
      .lb-table th {
        text-align: left;
        padding: 12px 14px;
        font-weight: 600;
        font-size: 0.78rem;
        text-transform: uppercase;
        color: var(--text3);
        border-bottom: 1px solid var(--border);
      }
      .lb-table td {
        padding: 12px 14px;
        font-size: 0.88rem;
        border-bottom: 1px solid var(--border);
      }
      .lb-rank {
        width: 40px;
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
      }
      .rank-1 {
        color: #fbbf24;
        font-size: 1.2rem;
      }
      .rank-2 {
        color: #94a3b8;
        font-size: 1.1rem;
      }
      .rank-3 {
        color: #cd7f32;
        font-size: 1.05rem;
      }
      .lb-user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .lb-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
      }
      .lb-name {
        font-weight: 600;
      }
      .lb-you {
        font-size: 0.65rem;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--accent);
        color: #fff;
        margin-left: 6px;
      }
      .lb-xp {
        font-family: "JetBrains Mono", monospace;
        font-weight: 600;
        color: var(--accent);
      }
      .lb-streak {
        color: var(--text2);
      }
      .lb-streak span {
        color: #f59e0b;
      }
      .lb-questions {
        font-family: "JetBrains Mono", monospace;
        color: var(--text2);
      }

      /* Race Cards */
      .races-section {
        margin-top: 30px;
      }
      .races-section h3 {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        margin-bottom: 14px;
      }
      .race-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
      }
      .race-card {
        padding: 20px;
        border-radius: 16px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
      }
      .rc-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .rc-title {
        font-weight: 700;
        font-size: 0.95rem;
      }
      .rc-badge {
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 0.7rem;
        font-weight: 600;
      }
      .rc-active {
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
      }
      .rc-ended {
        background: rgba(148, 163, 184, 0.15);
        color: #94a3b8;
      }
      .rc-participants {
        margin-bottom: 12px;
      }
      .rc-p {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        font-size: 0.82rem;
      }
      .rc-p-name {
        font-weight: 500;
      }
      .rc-p-score {
        font-family: "JetBrains Mono", monospace;
        color: var(--accent);
        font-weight: 600;
      }
      .rc-dates {
        font-size: 0.72rem;
        color: var(--text3);
      }

      .create-race-card {
        padding: 30px;
        border-radius: 16px;
        background: var(--surface);
        border: 2px dashed var(--border);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
      }
      .create-race-card:hover {
        border-color: var(--accent);
      }

      /* Create Race Modal */
      .race-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .race-modal.active {
        display: flex;
      }
      .rm-inner {
        width: 100%;
        max-width: 440px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 24px;
      }
      .rm-inner h3 {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        margin-bottom: 16px;
      }
      .rm-fg {
        margin-bottom: 14px;
      }
      .rm-fg label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text2);
        margin-bottom: 4px;
      }
      .rm-fg input,
      .rm-fg select {
        width: 100%;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.85rem;
        outline: none;
      }
      .rm-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 18px;
      }

      .empty-lb {
        text-align: center;
        padding: 40px 20px;
        color: var(--text3);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-left"><h2 class="topbar-title">Leaderboard</h2></div>
      <div class="topbar-right">
        <div class="topbar-stat">⚡ <span id="topXp">0</span> XP</div>
        <button
          class="topbar-btn"
          id="themeToggleBtn"
          onclick="lpToggleTheme()"
        >
          ☀️
        </button>
      </div>
    </div>

    <div class="main-content">
      <div class="page-content">
        <!-- Hero -->
        <div class="lb-hero">
          <h2>🏆 Compete with Friends</h2>
          <p>
            Add friends, create study races, and climb the leaderboard together!
          </p>
          <div class="lb-invite-row">
            <input
              type="text"
              class="lb-invite-input"
              id="friendName"
              placeholder="Friend's name…"
            />
            <button
              class="lp-btn lp-btn-secondary lp-btn-sm"
              style="
                background: rgba(255, 255, 255, 0.2);
                border-color: transparent;
                color: #fff;
              "
              onclick="addFriend()"
            >
              + Add Friend
            </button>
          </div>
        </div>

        <!-- Tabs -->
        <div class="lb-tabs">
          <div class="lb-tab active" data-tab="xp" onclick="switchTab('xp')">
            🏅 XP Ranking
          </div>
          <div class="lb-tab" data-tab="streak" onclick="switchTab('streak')">
            🔥 Streak
          </div>
          <div
            class="lb-tab"
            data-tab="questions"
            onclick="switchTab('questions')"
          >
            ❓ Questions
          </div>
        </div>

        <!-- Table -->
        <div class="lp-card" style="overflow-x: auto">
          <table class="lb-table" id="lbTable">
            <thead>
              <tr>
                <th style="width: 50px">Rank</th>
                <th>Name</th>
                <th>XP</th>
                <th>Streak</th>
                <th>Questions</th>
              </tr>
            </thead>
            <tbody id="lbBody"></tbody>
          </table>
        </div>

        <!-- Races -->
        <div class="races-section">
          <h3>🏁 Study Races</h3>
          <div class="race-grid" id="raceGrid"></div>
        </div>
      </div>
    </div>

    <!-- Create Race Modal -->
    <div class="race-modal" id="raceModal">
      <div class="rm-inner">
        <h3>Create Study Race</h3>
        <div class="rm-fg">
          <label>Race Name</label>
          <input
            type="text"
            id="raceName"
            placeholder="e.g. TCS NQT Sprint"
            maxlength="60"
          />
        </div>
        <div class="rm-fg">
          <label>Duration (days)</label>
          <input type="number" id="raceDays" value="7" min="1" max="90" />
        </div>
        <div class="rm-fg">
          <label>Goal</label>
          <select id="raceGoal">
            <option value="xp">Most XP earned</option>
            <option value="questions">Most questions solved</option>
            <option value="streak">Longest streak</option>
            <option value="studyTime">Most study time</option>
          </select>
        </div>
        <div class="rm-actions">
          <button class="lp-btn lp-btn-secondary" onclick="closeRaceModal()">
            Cancel
          </button>
          <button class="lp-btn lp-btn-primary" onclick="createRace()">
            Create Race
          </button>
        </div>
      </div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
      lpAuthGuard();
      lpInitPage("leaderboard");
      document.getElementById("topXp").textContent = state.xp || 0;

      let currentTab = "xp";

      // Generate simulated friends for leaderboard
      function getLeaderboardData() {
        const friends = state.friends || [];
        const answeredCount = Object.keys(state.answeredQuestions || {}).length;
        const me = {
          name: state.name || "You",
          avatar: state.avatarColor || "#7c3aed",
          xp: state.xp || 0,
          streak: state.streak || 0,
          questions: answeredCount,
          isMe: true,
        };

        // Simulated friend data with some variation
        const friendEntries = friends.map((f) => ({
          name: f.name || f,
          avatar:
            f.color ||
            ["#ef4444", "#f59e0b", "#10b981", "#0ea5e9", "#ec4899", "#8b5cf6"][
              Math.floor(Math.random() * 6)
            ],
          xp: Math.floor(Math.random() * (me.xp * 1.5 + 200)),
          streak: Math.floor(Math.random() * 15),
          questions: Math.floor(Math.random() * (answeredCount * 1.3 + 30)),
          isMe: false,
        }));

        return [me, ...friendEntries];
      }

      function switchTab(tab) {
        currentTab = tab;
        document
          .querySelectorAll(".lb-tab")
          .forEach((t) => t.classList.toggle("active", t.dataset.tab === tab));
        renderLeaderboard();
      }

      function renderLeaderboard() {
        const data = getLeaderboardData();
        const sortKey =
          currentTab === "xp"
            ? "xp"
            : currentTab === "streak"
              ? "streak"
              : "questions";
        data.sort((a, b) => b[sortKey] - a[sortKey]);

        const tbody = document.getElementById("lbBody");
        tbody.innerHTML = "";

        if (data.length <= 1 && (state.friends || []).length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-lb">Add friends to see them on the leaderboard!</td></tr>`;
          return;
        }

        data.forEach((entry, i) => {
          const rank = i + 1;
          const rankClass = rank <= 3 ? ` rank-${rank}` : "";
          const rankIcon =
            rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank;
          const tr = document.createElement("tr");
          tr.innerHTML = `
          <td class="lb-rank${rankClass}">${rankIcon}</td>
          <td>
            <div class="lb-user">
              <div class="lb-avatar" style="background:${entry.avatar}">${(entry.name || "?")[0].toUpperCase()}</div>
              <span class="lb-name">${escHtml(entry.name)}${entry.isMe ? '<span class="lb-you">YOU</span>' : ""}</span>
            </div>
          </td>
          <td class="lb-xp">⚡ ${entry.xp.toLocaleString()}</td>
          <td class="lb-streak"><span>🔥</span> ${entry.streak} days</td>
          <td class="lb-questions">${entry.questions}</td>
        `;
          tbody.appendChild(tr);
        });
      }

      function addFriend() {
        const input = document.getElementById("friendName");
        const name = input.value.trim();
        if (!name) {
          lpToast("Enter a friend's name!");
          return;
        }
        if (!state.friends) state.friends = [];
        if (state.friends.some((f) => (f.name || f) === name)) {
          lpToast("Already added!");
          return;
        }

        const colors = [
          "#ef4444",
          "#f59e0b",
          "#10b981",
          "#0ea5e9",
          "#ec4899",
          "#8b5cf6",
        ];
        state.friends.push({
          name,
          color: colors[state.friends.length % colors.length],
          addedAt: new Date().toISOString(),
        });
        addXP(5, "add-friend");
        saveState();
        input.value = "";
        document.getElementById("topXp").textContent = state.xp || 0;
        renderLeaderboard();
        lpToast("Friend added! 🎉");
      }

      // Races
      function renderRaces() {
        const grid = document.getElementById("raceGrid");
        grid.innerHTML = "";
        const races = state.races || [];

        const createCard = document.createElement("div");
        createCard.className = "create-race-card";
        createCard.onclick = () => openRaceModal();
        createCard.innerHTML =
          '<div style="font-size:2rem;margin-bottom:6px">🏁</div><div style="font-size:.88rem;font-weight:600;color:var(--text2)">Create Race</div>';
        grid.appendChild(createCard);

        races.forEach((race) => {
          const now = new Date();
          const end = new Date(race.endDate);
          const isActive = now < end;
          const card = document.createElement("div");
          card.className = "race-card";

          const participants = race.participants || [];
          const participantsHtml = participants
            .slice(0, 5)
            .map(
              (p) => `
          <div class="rc-p">
            <span class="rc-p-name">${escHtml(p.name)}</span>
            <span class="rc-p-score">${(race.scores?.[p.name] || 0).toLocaleString()}</span>
          </div>
        `,
            )
            .join("");

          card.innerHTML = `
          <div class="rc-header">
            <span class="rc-title">${escHtml(race.name)}</span>
            <span class="rc-badge ${isActive ? "rc-active" : "rc-ended"}">${isActive ? "🟢 Active" : "⏹ Ended"}</span>
          </div>
          <div class="rc-participants">${participantsHtml || '<div style="font-size:.82rem;color:var(--text3)">No participants yet</div>'}</div>
          <div class="rc-dates">Goal: ${race.goal || "XP"} · Ends: ${end.toLocaleDateString("en-IN", { day: "numeric", month: "short" })}</div>
        `;
          grid.appendChild(card);
        });
      }

      function openRaceModal() {
        document.getElementById("raceModal").classList.add("active");
      }

      function closeRaceModal() {
        document.getElementById("raceModal").classList.remove("active");
      }

      function createRace() {
        const name = document.getElementById("raceName").value.trim();
        if (!name) {
          lpToast("Enter a race name!");
          return;
        }
        const days = parseInt(document.getElementById("raceDays").value) || 7;
        const goal = document.getElementById("raceGoal").value;

        if (!state.races) state.races = [];
        const start = new Date();
        const end = new Date();
        end.setDate(end.getDate() + days);

        const me = { name: state.name || "You" };
        const friends = (state.friends || [])
          .slice(0, 4)
          .map((f) => ({ name: f.name || f }));

        state.races.push({
          id: "race_" + Date.now(),
          name,
          goal,
          startDate: start.toISOString(),
          endDate: end.toISOString(),
          participants: [me, ...friends],
          scores: {
            [me.name]: state.xp || 0,
            ...Object.fromEntries(
              friends.map((f) => [
                f.name,
                Math.floor(Math.random() * ((state.xp || 100) * 0.8)),
              ]),
            ),
          },
        });

        addXP(10, "create-race");
        saveState();
        closeRaceModal();
        renderRaces();
        renderLeaderboard();
        document.getElementById("topXp").textContent = state.xp || 0;
        lpToast("Race created! 🏁");
      }

      function escHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      renderLeaderboard();
      renderRaces();
    </script>
  </body>
</html>
