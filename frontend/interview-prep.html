<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnPath — Interview Preparation</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <style>
      .iv-hero {
        padding: 28px;
        border-radius: 20px;
        background: linear-gradient(135deg, #7c3aed, #2563eb);
        color: #fff;
        position: relative;
        overflow: hidden;
        margin-bottom: 24px;
      }
      .iv-hero::after {
        content: "";
        position: absolute;
        top: -40%;
        right: -8%;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
      }
      .iv-hero h1 {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        position: relative;
        z-index: 1;
      }
      .iv-hero p {
        font-size: 0.88rem;
        opacity: 0.85;
        margin-top: 4px;
        position: relative;
        z-index: 1;
      }

      .company-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
        margin-bottom: 28px;
      }
      .company-card {
        padding: 22px;
        border-radius: 18px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        cursor: pointer;
        transition: all 0.2s;
      }
      .company-card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        box-shadow: 0 8px 30px var(--accent-glow);
      }
      .cc-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .cc-logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        font-weight: 800;
        color: #fff;
      }
      .cc-name {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
      }
      .cc-type {
        font-size: 0.76rem;
        color: var(--text3);
      }
      .cc-rounds {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .cc-round-tag {
        padding: 5px 12px;
        border-radius: 8px;
        font-size: 0.75rem;
        font-weight: 600;
        background: var(--surface);
        color: var(--text2);
      }

      /* Detail view */
      .iv-detail {
        display: none;
      }
      .iv-detail.active {
        display: block;
      }
      .iv-back {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--accent);
        cursor: pointer;
        margin-bottom: 20px;
        padding: 6px 0;
      }

      .round-timeline {
        position: relative;
        padding-left: 28px;
      }
      .round-timeline::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }
      .round-card {
        position: relative;
        margin-bottom: 20px;
        padding: 22px;
        border-radius: 16px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        transition: all 0.2s;
      }
      .round-card:hover {
        border-color: var(--accent);
      }
      .round-dot {
        position: absolute;
        left: -22px;
        top: 26px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--surface3);
        border: 2px solid var(--border);
      }
      .round-dot.active {
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 8px var(--accent-glow);
      }
      .round-dot.done {
        background: var(--success);
        border-color: var(--success);
      }
      .rc-num {
        font-size: 0.72rem;
        color: var(--accent);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .rc-title {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        margin-bottom: 6px;
      }
      .rc-desc {
        font-size: 0.85rem;
        color: var(--text2);
        margin-bottom: 12px;
        line-height: 1.6;
      }
      .rc-tips {
        padding: 14px;
        border-radius: 12px;
        background: var(--surface);
        margin-bottom: 14px;
      }
      .rc-tips h4 {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .rc-tips ul {
        padding-left: 18px;
        font-size: 0.82rem;
        color: var(--text2);
        line-height: 1.7;
      }
      .rc-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      /* Mock Interview */
      .mock-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .mock-overlay.active {
        display: flex;
      }
      .mock-modal {
        width: 100%;
        max-width: 700px;
        max-height: 90vh;
        overflow-y: auto;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 32px;
      }
      .mock-close {
        float: right;
        background: var(--surface2);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 0.9rem;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mock-close:hover {
        background: var(--danger);
        color: #fff;
      }
      .mock-q {
        padding: 18px;
        border-radius: 14px;
        background: var(--surface);
        margin-bottom: 14px;
      }
      .mock-q-label {
        font-size: 0.72rem;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 4px;
      }
      .mock-q-text {
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.6;
      }
      .mock-answer {
        width: 100%;
        min-height: 100px;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.9rem;
        resize: vertical;
        outline: none;
        font-family: "DM Sans", sans-serif;
      }
      .mock-answer:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--input-focus);
      }
      .ai-feedback {
        padding: 16px;
        border-radius: 14px;
        background: var(--surface);
        border-left: 3px solid var(--accent);
        margin-top: 14px;
        font-size: 0.85rem;
        line-height: 1.7;
      }
      .loading-ai {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px;
        font-size: 0.9rem;
        color: var(--text2);
      }
      .loading-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: ldot 0.6s infinite alternate;
      }
      .loading-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loading-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes ldot {
        to {
          opacity: 0.2;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-left">
        <h2 class="topbar-title">Interview Preparation</h2>
      </div>
      <div class="topbar-right">
        <div class="topbar-stat">⚡ <span id="topXp">0</span> XP</div>
        <button
          class="topbar-btn"
          id="themeToggleBtn"
          onclick="lpToggleTheme()"
        >
          ☀️
        </button>
      </div>
    </div>

    <div class="main-content">
      <div class="page-content">
        <!-- Company List -->
        <div id="ivListView">
          <div class="iv-hero">
            <h1>💼 Interview Preparation</h1>
            <p>
              Prepare for every round — Aptitude, Technical, Managerial & HR.
              Company-specific tips included.
            </p>
          </div>
          <div class="company-grid" id="companyGrid"></div>
        </div>

        <!-- Company Detail -->
        <div class="iv-detail" id="ivDetailView">
          <div class="iv-back" onclick="showCompanyList()">
            ← Back to Companies
          </div>
          <div style="margin-bottom: 24px">
            <h2
              id="ivCompanyName"
              style="
                font-family: &quot;Syne&quot;, sans-serif;
                font-size: 1.4rem;
                font-weight: 700;
              "
            ></h2>
            <p
              id="ivCompanySub"
              style="font-size: 0.85rem; color: var(--text3); margin-top: 4px"
            ></p>
          </div>
          <div class="round-timeline" id="roundTimeline"></div>
        </div>
      </div>
    </div>

    <!-- Mock Interview Modal -->
    <div class="mock-overlay" id="mockOverlay">
      <div class="mock-modal" id="mockModal"></div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/data/exams-data.js"></script>
    <script src="js/gemini-api.js"></script>
    <script>
      lpAuthGuard();
      lpInitPage("interview");
      document.getElementById("topXp").textContent = state.xp || 0;

      // Render company cards
      function renderCompanies() {
        const grid = document.getElementById("companyGrid");
        grid.innerHTML = "";
        const BG_COLORS = {
          tcs: "#0066b3",
          infosys: "#007cc3",
          wipro: "#44147a",
          cognizant: "#0033a0",
          accenture: "#a100ff",
          hcl: "#0078d4",
          capgemini: "#0070ad",
        };

        Object.entries(INTERVIEW_COMPANIES).forEach(([id, company]) => {
          const card = document.createElement("div");
          card.className = "company-card";
          card.onclick = () => showCompanyDetail(id);
          card.innerHTML = `
          <div class="cc-header">
            <div class="cc-logo" style="background:${BG_COLORS[id] || "#7c3aed"}">${company.name[0]}</div>
            <div><div class="cc-name">${company.name}</div><div class="cc-type">${company.type || "IT Services"}</div></div>
          </div>
          <div class="cc-rounds">${company.rounds.map((r) => `<span class="cc-round-tag">${r.icon || "📋"} ${r.name}</span>`).join("")}</div>
        `;
          grid.appendChild(card);
        });
      }
      renderCompanies();

      // Detail view
      let currentCompanyId = null;
      function showCompanyDetail(id) {
        currentCompanyId = id;
        const company = INTERVIEW_COMPANIES[id];
        if (!company) return;

        document.getElementById("ivListView").style.display = "none";
        document.getElementById("ivDetailView").classList.add("active");
        document.getElementById("ivCompanyName").textContent =
          `${company.name} Interview Preparation`;
        document.getElementById("ivCompanySub").textContent =
          `${company.rounds.length} rounds — Complete preparation workflow`;

        const timeline = document.getElementById("roundTimeline");
        timeline.innerHTML = "";

        const progress = state.interviewProgress?.[id] || {};

        company.rounds.forEach((round, i) => {
          const roundDone = progress[round.id]?.done;
          const card = document.createElement("div");
          card.className = "round-card";
          card.innerHTML = `
          <div class="round-dot ${roundDone ? "done" : i === 0 ? "active" : ""}"></div>
          <div class="rc-num">Round ${i + 1}</div>
          <div class="rc-title">${round.icon || ""} ${round.name}</div>
          <div class="rc-desc">${round.description}</div>
          <div class="rc-tips">
            <h4>💡 Tips for this round</h4>
            <ul>${round.tips.map((t) => `<li>${t}</li>`).join("")}</ul>
          </div>
          <div class="rc-actions">
            <button class="lp-btn lp-btn-primary lp-btn-sm" onclick="startMockRound('${id}','${round.id}',${i})">🎯 Practice This Round</button>
            <button class="lp-btn lp-btn-secondary lp-btn-sm" onclick="getAITips('${id}','${round.id}')">🤖 AI Tips</button>
            ${roundDone ? '<span style="color:var(--success);font-size:.82rem;font-weight:600">✅ Completed</span>' : ""}
          </div>
        `;
          timeline.appendChild(card);
        });
      }

      function showCompanyList() {
        document.getElementById("ivDetailView").classList.remove("active");
        document.getElementById("ivListView").style.display = "";
      }

      // Mock Interview Round
      async function startMockRound(companyId, roundId, roundIdx) {
        const company = INTERVIEW_COMPANIES[companyId];
        const round = company?.rounds.find((r) => r.id === roundId);
        if (!round) return;

        const modal = document.getElementById("mockModal");
        modal.innerHTML = `<div class="loading-ai"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div> Generating ${round.name} questions…</div>`;
        document.getElementById("mockOverlay").classList.add("active");

        let questions = [];
        try {
          if (isGeminiConfigured()) {
            questions = await aiMockInterview(company.name, round.name, 5);
          } else {
            throw new Error("no key");
          }
        } catch (e) {
          questions = getDefaultRoundQuestions(round);
        }

        renderMockQuestions(companyId, roundId, round, questions);
      }

      function getDefaultRoundQuestions(round) {
        const defaults = {
          aptitude: [
            "A train 150m long passes a pole in 10 seconds. What is its speed?",
            "If 6 workers can complete a task in 12 days, how many days will 9 workers take?",
            "What is 35% of 240?",
            "A man buys an article for Rs.500 and sells it at 20% profit. What is the selling price?",
            "Find the next number: 2, 6, 12, 20, 30, ?",
          ],
          technical: [
            "What is the difference between an Array and a Linked List?",
            "Explain the concept of OOP and its four pillars.",
            "What is normalization in databases? Explain up to 3NF.",
            "Write a function to check if a string is a palindrome.",
            "What is the time complexity of binary search?",
          ],
          managerial: [
            "Tell me about a time you faced a tight deadline. How did you handle it?",
            "How do you prioritize tasks when everything seems urgent?",
            "Describe a situation where you had a conflict with a team member.",
            "What would you do if you disagreed with your manager?",
            "Where do you see yourself in 5 years?",
          ],
          hr: [
            "Tell me about yourself.",
            "Why do you want to join our company?",
            "What are your strengths and weaknesses?",
            "Are you willing to relocate? What are your salary expectations?",
            "Do you have any questions for us?",
          ],
        };
        return (defaults[round.id] || defaults.technical).map((q) => ({
          question: q,
        }));
      }

      function renderMockQuestions(companyId, roundId, round, questions) {
        const modal = document.getElementById("mockModal");
        let html = `<button class="mock-close" onclick="closeMock()">✕</button>
        <h2 style="font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:6px">${round.name} — Mock Practice</h2>
        <p style="font-size:.82rem;color:var(--text3);margin-bottom:20px">${INTERVIEW_COMPANIES[companyId].name} · Answer each question below</p>`;

        questions.forEach((q, i) => {
          html += `
          <div class="mock-q">
            <div class="mock-q-label">Question ${i + 1}</div>
            <div class="mock-q-text">${q.question}</div>
          </div>
          <textarea class="mock-answer" id="mockAns${i}" placeholder="Type your answer here…" rows="3"></textarea>
          <div id="mockFeedback${i}"></div>
          <div style="margin-bottom:20px">
            <button class="lp-btn lp-btn-secondary lp-btn-sm" onclick="getAnswerFeedback(${i},'${encodeURIComponent(q.question)}','${roundId}')" style="margin-top:8px">🤖 Get AI Feedback</button>
          </div>`;
        });

        html += `<div style="text-align:center;margin-top:20px">
        <button class="lp-btn lp-btn-primary" onclick="completeRound('${companyId}','${roundId}')">✅ Mark Round Complete</button>
      </div>`;

        modal.innerHTML = html;
      }

      async function getAnswerFeedback(idx, questionEnc, roundId) {
        const answer = document.getElementById("mockAns" + idx).value.trim();
        if (!answer) {
          lpToast("Please write an answer first!");
          return;
        }

        const fb = document.getElementById("mockFeedback" + idx);
        fb.innerHTML = `<div class="loading-ai" style="padding:10px"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div> Analyzing…</div>`;

        try {
          if (isGeminiConfigured()) {
            const question = decodeURIComponent(questionEnc);
            const prompt = `You are an interview coach. Evaluate this answer for a ${roundId} interview round.\n\nQuestion: ${question}\nAnswer: ${answer}\n\nGive brief feedback: what's good, what can be improved, and a score out of 10. Keep it concise (3-4 lines).`;
            const result = await geminiRequest(prompt);
            fb.innerHTML = `<div class="ai-feedback">🤖 <strong>AI Feedback:</strong><br>${result.replace(/\n/g, "<br>")}</div>`;
          } else {
            fb.innerHTML = `<div class="ai-feedback">💡 <strong>Tip:</strong> Add your Gemini API key in Settings to get AI-powered feedback on your answers.</div>`;
          }
        } catch (e) {
          fb.innerHTML = `<div class="ai-feedback">⚠️ Could not get feedback. Check your API key in Settings.</div>`;
        }
      }

      function completeRound(companyId, roundId) {
        if (!state.interviewProgress[companyId])
          state.interviewProgress[companyId] = {};
        state.interviewProgress[companyId][roundId] = {
          done: true,
          date: new Date().toISOString(),
        };
        addXP(50, "interview-round");
        saveState();
        closeMock();
        showCompanyDetail(companyId); // Refresh
        lpToast("Round completed! +50 XP 🎉");
      }

      async function getAITips(companyId, roundId) {
        if (!isGeminiConfigured()) {
          lpToast("Add Gemini API key in Settings first!");
          return;
        }
        const company = INTERVIEW_COMPANIES[companyId];
        const round = company?.rounds.find((r) => r.id === roundId);
        if (!round) return;

        try {
          const tips = await aiInterviewTips(company.name, round.name);
          const modal = document.getElementById("mockModal");
          modal.innerHTML = `<button class="mock-close" onclick="closeMock()">✕</button>
          <h2 style="font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:12px">🤖 AI Tips — ${round.name}</h2>
          <div class="ai-feedback">${tips.replace(/\n/g, "<br>")}</div>`;
          document.getElementById("mockOverlay").classList.add("active");
        } catch (e) {
          lpToast("Failed to get AI tips. Try again.");
        }
      }

      function closeMock() {
        document.getElementById("mockOverlay").classList.remove("active");
        document.getElementById("topXp").textContent = state.xp || 0;
      }
    </script>
  </body>
</html>
